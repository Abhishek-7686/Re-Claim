<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ReClaim</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">Re<span>Claim</span></a>

        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="found-items.html">Found Items</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="nav-buttons">
            <a href="login.html" class="btn outline">Login</a>
            <a href="register.html" class="btn">Register</a>
            <button class="menu-btn" id="menuBtn">☰</button>
        </div>
    </div>
</nav>

<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join ReClaim to report and claim items.</p>

            <!-- Role selection: Student or Admin -->
            <div class="role-toggle">
                <button type="button" class="role-btn active" id="studentBtn">Student</button>
                <button type="button" class="role-btn" id="adminBtn">Admin</button>
            </div>

            <!-- Student Registration Form -->
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="studentEmail">College Email</label>
                    <input type="email" id="studentEmail" placeholder="you@college.edu" required>
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g. 23CSE1045" required>
                </div>

                <div class="form-group">
                    <label for="studentDept">Department</label>
                    <input type="text" id="studentDept" placeholder="e.g. CSE" required>
                </div>

                <div class="form-group">
                    <label for="studentYear">Year</label>
                    <input type="number" id="studentYear" placeholder="e.g. 3" min="1" max="5" required>
                </div>

                <div class="form-group">
                    <label for="studentPhone">Phone Number</label>
                    <input type="tel" id="studentPhone" placeholder="Your phone number" required>
                </div>

                <div class="form-group">
                    <label for="studentPassword">Password</label>
                    <input type="password" id="studentPassword" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="studentConfirmPassword">Confirm Password</label>
                    <input type="password" id="studentConfirmPassword" placeholder="Re-enter your password" required>
                </div>

                <button type="submit" class="btn full-width">Register as Student</button>
            </form>

            <!-- Admin Registration Form (hidden by default) -->
            <form id="adminForm" class="hidden">
                <div class="form-group">
                    <label for="adminName">Full Name</label>
                    <input type="text" id="adminName" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="adminEmail">Official Email</label>
                    <input type="email" id="adminEmail" placeholder="you@college.edu" required>
                </div>

                <div class="form-group">
                    <label for="staffId">Staff ID</label>
                    <input type="text" id="staffId" placeholder="e.g. STAFF001" required>
                </div>

                <div class="form-group">
                    <label for="adminDept">Department</label>
                    <input type="text" id="adminDept" placeholder="e.g. Administration" required>
                </div>

                <div class="form-group">
                    <label for="adminPhone">Phone Number</label>
                    <input type="tel" id="adminPhone" placeholder="Your phone number" required>
                </div>

                <div class="form-group">
                    <label for="adminKey">Admin Registration Key</label>
                    <input type="text" id="adminKey" placeholder="Provided by college" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="adminConfirmPassword">Confirm Password</label>
                    <input type="password" id="adminConfirmPassword" placeholder="Re-enter your password" required>
                </div>

                <button type="submit" class="btn full-width">Register as Admin</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p>© 2026 ReClaim - College Lost & Found System</p>
    </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
